name: Release

# Builds a release APK for every pushed tag that looks like a version (v1.2.3)
# and publishes it as a GitHub Release with the APK attached.
#
# Signing: when the four secrets below are configured, the APK is signed with the
# project's release keystore. Without them the build falls back to the debug
# signing key (see app/build.gradle.kts); such APKs are only good for testing,
# because an app installed from a debug-signed APK cannot be upgraded to a
# release-signed one.
#
#   KEYSTORE_BASE64    base64 of the .jks file      (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  keystore (store) password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; the APK will be signed with the debug key."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          tag="${GITHUB_REF_NAME}"
          suffix=""
          if [ "${{ steps.keystore.outputs.signed }}" = "debug" ]; then suffix="-debugsigned"; fi
          out="Amperfy4Android-${tag}${suffix}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
